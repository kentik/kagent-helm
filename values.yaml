# Default values for kagent Helm chart
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# ============================================================================
# Deployment Pattern Selection
# ============================================================================
# Choose the Kubernetes workload type that best fits your use case:
#
# statefulset (RECOMMENDED):
#   - Default and most common pattern for kagent deployments
#   - Provides stable network identities and persistent storage
#   - Ideal for agents that need to maintain state and identity
#   - Supports multiple replicas with individual storage volumes
#   - Best for production environments requiring data persistence
#
# daemonset:
#   - Deploys one agent pod per node in the cluster
#   - Ideal for node-level monitoring scenarios
#   - Use cases: monitoring all DNS servers, per-node metrics collection
#   - Automatically scales with cluster node count
#   - Typically uses hostPath volumes for local node storage
#
deploymentType: statefulset

# Number of replicas (StatefulSet patterns only)
# DaemonSet pattern ignores this value
replicaCount: 1

# Kagent container image configuration
image:
  repository: kentik/kagent
  pullPolicy: IfNotPresent
  tag: v5.0.19

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Kagent configuration
kagent:

  # Company ID for agent registration
  # Maps to env K_COMPANY_ID
  companyId: ""

  # Provisioning token for agent registration
  # Maps to env K_REGISTER_PROVISIONING_TOKEN (injected via Secret)
  provisioningToken: ""

  # Release channel for agent binary updates (stable, beta, dev)
  # Maps to env K_RELEASE_CHANNEL
  releaseChannel: stable

  # Disk space reservation to prevent OOS conditions
  diskReservation:
    enabled: true                 # K_DISK_SPACE_RESERVATION_ENABLED
    initialSize: "200MB"         # K_DISK_SPACE_RESERVATION_INITIAL_SIZE

  # Logging destination (stdout|stderr|discard|filename)
  # Maps to env K_LOG_DEST
  # Default: stdout (Kubernetes best practice - enables kubectl logs and cluster log collection)
  logDest: stdout

  # Log level: debug, info, warn, error
  logLevel: info

  # Kentik API endpoint
  apiEndpoint: "grpc.api.kentik.com:443"

# Service account configuration
serviceAccount:
  create: true
  annotations: {}
  name: ""

# RBAC configuration (if kagent needs Kubernetes API access)
rbac:
  create: false

# Network policy configuration (opt-in, disabled by default for compatibility)
# Configure according to organizational policies
# When service capability ports are enabled, Ingress rules are automatically added
# to allow inbound traffic on those ports. Egress rules for capability-specific
# outbound traffic (synthetics TCP 8877, etc.) are also added automatically.
networkPolicy:
  enabled: false
  egress:
    # DNS
    - to:
      - namespaceSelector: {}
      ports:
      - protocol: UDP
        port: 53
    # Kentik API
    - to:
      - ipBlock:
          cidr: 0.0.0.0/0
      ports:
      - protocol: TCP
        port: 443
    # SNMP/Streaming Telemetry polling via ranger (adjust CIDR for your network)
    # - to:
    #   - ipBlock:
    #       cidr: 10.0.0.0/8
    #   ports:
    #   - protocol: UDP
    #     port: 161
    # SSH for NMS / Agentic Analysis (adjust CIDR for your managed devices)
    # - to:
    #   - ipBlock:
    #       cidr: 10.0.0.0/8
    #   ports:
    #   - protocol: TCP
    #     port: 22

  # Restrict which sources can reach capability inbound ports (optional).
  # If not set, all sources are allowed (any pod, any namespace, any external IP).
  # ingressFrom:
  #   - ipBlock:
  #       cidr: 10.0.0.0/8
  #   - namespaceSelector:
  #       matchLabels:
  #         kubernetes.io/metadata.name: network-devices

# Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 500
  fsGroup: 500

# Container security context
#
# Some Universal Agent capabilities require specific Linux capabilities to function
# correctly. By default, all capabilities are dropped and only the required ones are
# added back. If you are not using certain UA capabilities, you can remove the
# corresponding Linux capabilities from the 'add' list to follow the principle of
# least privilege.
#
# Linux capabilities mapped to Universal Agent capabilities:
#   NET_ADMIN        - kdns (network administration operations)
#   NET_BIND_SERVICE - kbgp, kproxy (bind to privileged ports below 1024)
#   NET_RAW          - ranger (SNMP/Streaming Telemetry), ksynth, livesynth (raw sockets)

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
    add:
    - NET_RAW
  readOnlyRootFilesystem: false  # kagent needs to write to /opt/kentik

# Resource limits and requests.
# Note that resource usage is highly dependent of what capabilities are enabled in kagent.
# The default values here are a starting point for a minimal NMS deployment.
# Refer to each capability documentation for recommended resources. Adjust these values based on your deployment size and enabled features.
resources:
  requests:
    cpu: 1
    memory: 1024Mi
  limits:
    cpu: 2
    memory: 4096Mi

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity rules
affinity: {}

# Persistence configuration
persistence:
  # Enable persistent storage (StatefulSet: PVC, DaemonSet: hostPath or emptyDir)
  enabled: true

  # Volume type: pvc, hostPath, emptyDir
  # - pvc: PersistentVolumeClaim (StatefulSet default)
  # - hostPath: Host directory mount (DaemonSet local storage)
  # - emptyDir: Temporary pod storage (Deployment/DaemonSet default)
  type: pvc

  # PVC configuration (when type: pvc)
  pvc:
    # Storage class name (empty string uses cluster default)
    storageClass: ""
    # Volume size for application data
    size: 10Gi
    # Access modes
    accessModes:
      - ReadWriteOnce

  # HostPath configuration (when type: hostPath, typically for DaemonSet)
  hostPath:
    # Path on the host machine for kagent data. Make sure user 500:500 has read/write permissions.
    path: /var/lib/kagent/data
    # Type of hostPath volume (DirectoryOrCreate, Directory, etc.)
    type: DirectoryOrCreate

  # Separate volume for keypair (recommended for security)
  keypair:
    enabled: true

    # Keypair storage type: secret, pvc, hostPath, emptyDir
    # - secret: Kubernetes Secret (recommended, use generate-secrets.sh)
    # - pvc: Separate PVC for keys (StatefulSet)
    # - hostPath: Host directory for keys (DaemonSet)
    # - emptyDir: Temporary storage (not recommended for production)
    type: secret

    # PVC configuration (when type: pvc)
    pvc:
      storageClass: ""
      size: 100Mi
      accessModes:
        - ReadWriteOnce

    # HostPath configuration (when type: hostPath)
    hostPath:
      # Path on the host machine for keypair. Make sure user 500:500 has read/write permissions.
      path: /var/lib/kagent/keys
      # Type of hostPath volume
      type: DirectoryOrCreate

    # Secret configuration (when type: secret)
    # Provide base64-encoded keys via secrets, use generate-secrets.sh script
    secret:
      # Secret name pattern will be: {{ fullname }}-{replica-index}-secret
      # Keys must be named: private_key.pem, public_key.pem
      name: ""

# Service configuration
# Exposes inbound ports for UA capabilities that receive traffic from network devices.
# Each capability can be individually enabled/disabled.
service:
  enabled: false
  type: ClusterIP
  # Annotations to add to the Service (e.g., for cloud load balancer configuration)
  annotations: {}

  # External traffic policy: Cluster (default) or Local
  # Set to "Local" to preserve the source IP of incoming packets. This is critical for
  # flow proxy (NetFlow/IPFIX/sFlow) where the sender's IP is the device identity.
  # Only applies to NodePort and LoadBalancer service types.
  # WARNING: With externalTrafficPolicy: Local and replicaCount: 1, traffic arriving
  # at nodes without a kagent pod will be dropped. Ensure your LB health checks are
  # configured, or use replicaCount >= node count for full coverage.
  # externalTrafficPolicy: Local

  # IPv6 / Dual-stack configuration (requires Kubernetes 1.23+ with dual-stack enabled)
  # ipFamilyPolicy: RequireDualStack   # SingleStack, PreferDualStack, or RequireDualStack
  # ipFamilies:
  #   - IPv4
  #   - IPv6

  # Session affinity: None (default) or ClientIP
  # Set to ClientIP for UDP protocols (flow proxy, syslog) to ensure packets from
  # the same source device consistently reach the same pod, preventing split flow records.
  # sessionAffinity: ClientIP
  # sessionAffinityConfig:
  #   clientIP:
  #     timeoutSeconds: 10800  # 3 hours

  # Restrict LoadBalancer source IPs (LoadBalancer type only)
  # loadBalancerSourceRanges:
  #   - 10.0.0.0/8
  #   - 192.168.0.0/16

  # Flow Proxy - receives NetFlow/sFlow/IPFIX from routers/switches
  # IMPORTANT: The port must match the listening port configured in the Kentik portal.
  # The Helm chart opens the network path but the agent's listening port is set server-side.
  flowProxy:
    enabled: false
    port: 9995
    # targetPort: 9995  # Optional: container listening port if different from service port
    protocol: UDP
    # nodePort: 30995  # Optional: pin a specific node port (NodePort/LoadBalancer only)

  # SNMP Trap Receiver - receives SNMP traps from network devices
  # IMPORTANT: The port must match the listening port configured in the Kentik portal.
  snmpTrap:
    enabled: false
    port: 162
    # targetPort: 162
    protocol: UDP
    # nodePort: 30162  # Optional: pin a specific node port (NodePort/LoadBalancer only)

  # Syslog Server - receives syslog messages from network devices
  # IMPORTANT: The port must match the listening port configured in the Kentik portal.
  syslog:
    enabled: false
    # Expose both UDP and TCP for syslog
    port: 514
    # targetPort: 514
    protocols:
      - UDP
      - TCP
    # nodePorts: [30514, 30515]  # Optional: pin node ports per protocol (same order as protocols list)

  # BGP Proxy - receives BGP peering sessions from routers
  # IMPORTANT: The port must match the listening port configured in the Kentik portal.
  bgp:
    enabled: false
    port: 179
    # targetPort: 179
    protocol: TCP
    # nodePort: 30179  # Optional: pin a specific node port (NodePort/LoadBalancer only)

  # Synthetics test agent - receives inbound mesh test probes (UDP 9977)
  # NOTE: TCP 8877 is used for outbound mesh test initiation and is handled
  # automatically via NetworkPolicy egress when synthetics is enabled.
  synthetics:
    enabled: false
    port: 9977
    # targetPort: 9977
    protocol: UDP
    # nodePort: 30977  # Optional: pin a specific node port (NodePort/LoadBalancer only)

  # Health check endpoint
  # When enabled, automatically starts the HC server (K_HC_SERVER_ENABLED=true)
  # even if liveness/readiness probes are not configured.
  # To disable HC server while keeping the service port: use configmap to override K_HC_SERVER_ENABLED=false
  healthCheck:
    enabled: false
    port: 8099
    # targetPort: 8099
    protocol: TCP
    # nodePort: 30099  # Optional: pin a specific node port (NodePort/LoadBalancer only)

# ConfigMap configuration (optional, environment variables take precedence)
configmap:
  enabled: false
  data: {}
    # Example additional config
    # K_CUSTOM_SETTING: "value"
