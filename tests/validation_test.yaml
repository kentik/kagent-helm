suite: Validation tests
templates:
  - statefulset.yaml
set:
  kagent.companyId: "12345"
  kagent.provisioningToken: "test-token"

tests:
  - it: should fail when companyId is empty
    set:
      kagent.companyId: ""
    asserts:
      - failedTemplate: {}

  - it: should fail when provisioningToken is empty
    set:
      kagent.provisioningToken: ""
    asserts:
      - failedTemplate: {}

  - it: should not render statefulset for invalid deploymentType
    set:
      deploymentType: daemonset
    asserts:
      - hasDocuments:
          count: 0

  - it: should fail when service.enabled but no capabilities enabled
    set:
      service.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "service.enabled is true but no capability ports are enabled. Enable at least one of: flowProxy, snmpTrap, syslog, bgp, synthetics, healthCheck"
